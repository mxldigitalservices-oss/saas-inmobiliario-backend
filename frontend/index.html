<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/static/session.js"></script>
  <title>Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } }
    }
  </script>
  <style>
    body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
    .bg-orb { filter: blur(80px); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp .6s ease-out both; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
    .shake { animation: shake .4s ease-in-out; }
  </style>
</head>
<body class="h-full bg-slate-50 antialiased text-slate-900">

  <div class="relative min-h-screen flex items-center justify-center px-4 py-12 overflow-hidden">

    <!-- Fondo decorativo -->
    <div class="bg-orb pointer-events-none absolute -top-32 -left-32 h-96 w-96 rounded-full bg-indigo-200/60"></div>
    <div class="bg-orb pointer-events-none absolute -bottom-32 -right-32 h-96 w-96 rounded-full bg-violet-200/50"></div>

    <main class="relative w-full max-w-md fade-up">

      <!-- Logo -->
      <div class="flex flex-col items-center mb-8">
        <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-600 shadow-lg shadow-indigo-600/30">
          <svg class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955a1.126 1.126 0 011.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
          </svg>
        </div>
        <h1 class="mt-5 text-2xl font-bold tracking-tight text-slate-900">Bienvenido de nuevo</h1>
        <p class="mt-1.5 text-sm text-slate-500">Accede a tu panel de gestión inmobiliaria</p>
      </div>

      <!-- Tarjeta -->
      <div class="rounded-2xl border border-slate-100 bg-white p-8 shadow-sm transition-shadow duration-300 hover:shadow-lg sm:p-10">

        <!-- Alerta de error -->
        <div id="error-box" role="alert" class="hidden mb-6 flex items-start gap-3 rounded-xl bg-rose-50 px-4 py-3 text-sm text-rose-700">
          <svg class="mt-0.5 h-4 w-4 flex-none" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0v-4.5A.75.75 0 0110 5zm0 10a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" />
          </svg>
          <span id="error-text"></span>
        </div>

        <form id="login-form" class="space-y-6" novalidate>

          <div>
            <label for="email" class="block text-sm font-medium text-slate-700 mb-2">Correo electrónico</label>
            <input id="email" name="email" type="email" autocomplete="email" required placeholder="tu@empresa.com"
              class="block w-full rounded-xl border-0 bg-slate-50 px-4 py-3.5 text-sm text-slate-900 placeholder-slate-400 outline-none ring-1 ring-transparent transition focus:bg-white focus:ring-2 focus:ring-indigo-500">
          </div>

          <div>
            <div class="flex items-center justify-between mb-2">
              <label for="password" class="block text-sm font-medium text-slate-700">Contraseña</label>
              <a href="#" class="text-xs font-medium text-indigo-600 transition hover:text-indigo-700">¿Olvidaste tu contraseña?</a>
            </div>
            <div class="relative">
              <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••"
                class="block w-full rounded-xl border-0 bg-slate-50 px-4 py-3.5 pr-12 text-sm text-slate-900 placeholder-slate-400 outline-none ring-1 ring-transparent transition focus:bg-white focus:ring-2 focus:ring-indigo-500">
              <button type="button" id="toggle-password" aria-label="Mostrar u ocultar contraseña"
                class="absolute inset-y-0 right-0 flex items-center px-4 text-slate-400 transition hover:text-slate-600">
                <svg id="eye-icon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
              </button>
            </div>
          </div>

          <div id="agency-field" class="hidden">
            <label for="agency" class="block text-sm font-medium text-slate-700 mb-2">Código de tu agencia</label>
            <input id="agency" name="agency" type="text" autocomplete="organization" placeholder="mi-agencia"
              class="block w-full rounded-xl border-0 bg-slate-50 px-4 py-3.5 text-sm text-slate-900 placeholder-slate-400 outline-none ring-1 ring-transparent transition focus:bg-white focus:ring-2 focus:ring-indigo-500">
            <p class="mt-1.5 text-xs text-slate-500">Tu correo existe en más de una agencia; indica el código para continuar.</p>
          </div>

          <button id="submit-btn" type="submit"
            class="flex w-full items-center justify-center gap-2 rounded-xl bg-indigo-600 px-4 py-3.5 text-sm font-semibold text-white shadow-sm transition duration-200 hover:bg-indigo-700 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-70">
            <svg id="spinner" class="hidden h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
            <span id="btn-text">Iniciar sesión</span>
          </button>
        </form>
      </div>

      <p class="mt-8 text-center text-xs text-slate-400">Plataforma de gestión inmobiliaria · República Dominicana</p>
    </main>
  </div>

  <script type="module">
    const TENANT_LOGIN = '/api/v1/auth/login';
    const SUPERADMIN_LOGIN = '/api/v1/auth/superadmin/login';

    const $ = (id) => document.getElementById(id);
    const form = $('login-form');
    const emailInput = $('email');
    const passwordInput = $('password');
    const agencyInput = $('agency');
    const submitBtn = $('submit-btn');
    const btnText = $('btn-text');
    const spinner = $('spinner');
    const errorBox = $('error-box');
    const errorText = $('error-text');
    const card = form.closest('div.rounded-2xl');

    const setLoading = (loading) => {
      submitBtn.disabled = loading;
      spinner.classList.toggle('hidden', !loading);
      btnText.textContent = loading ? 'Ingresando...' : 'Iniciar sesión';
    };

    const showError = (message) => {
      errorText.textContent = message;
      errorBox.classList.remove('hidden');
      errorBox.classList.add('flex');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    };

    const hideError = () => {
      errorBox.classList.add('hidden');
      errorBox.classList.remove('flex');
    };

    const extractMessage = (data, fallback) => {
      if (!data) return fallback;
      if (typeof data.detail === 'string') return data.detail;
      if (Array.isArray(data.detail) && data.detail[0]?.msg) return data.detail[0].msg;
      if (data.detail?.message) return data.detail.message;
      if (data.message) return data.message;
      return fallback;
    };

    // Mostrar / ocultar contraseña
    $('toggle-password').addEventListener('click', () => {
      passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    });

    // Sesión previa: solo se reutiliza si el token es válido (así no hay bucles con el dashboard/admin)
    if (Session.valid()) {
      window.location.replace(Session.home(Session.audience()));
    } else {
      Session.clear();
    }

    const post = async (url, body) => {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(body)
      });
      let data = null;
      try { data = await response.json(); } catch (_) { /* respuesta sin JSON */ }
      return { response, data };
    };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const agency = agencyInput.value.trim().toLowerCase();

      if (!email || !password) {
        showError('Ingresa tu correo y contraseña.');
        return;
      }

      setLoading(true);

      try {
        // 1) Agente / encargado de agencia
        let result = await post(TENANT_LOGIN, agency ? { email, password, agency } : { email, password });

        // 2) Si las credenciales no son de una agencia, probar como Superadministrador
        if (result.response.status === 401 && !agency) {
          const sa = await post(SUPERADMIN_LOGIN, { email, password });
          if (sa.response.ok) result = sa;
        }

        if (result.response.status === 409 && result.data?.detail?.code === 'agency_required') {
          $('agency-field').classList.remove('hidden');
          agencyInput.focus();
          throw new Error(extractMessage(result.data, 'Indica el código de tu agencia.'));
        }

        if (!result.response.ok) {
          const s = result.response.status;
          const fallback = s === 401 || s === 403
            ? 'Credenciales incorrectas. Verifica tus datos.'
            : 'No se pudo iniciar sesión. Intenta de nuevo.';
          throw new Error(extractMessage(result.data, fallback));
        }

        const data = result.data;
        if (!data?.access_token) {
          throw new Error('Respuesta inválida del servidor.');
        }

        // Guardar el token (misma clave para todos) y redirigir según el rol (claim "aud" del JWT)
        Session.clear();
        localStorage.setItem('access_token', data.access_token);
        if (data.refresh_token) localStorage.setItem('refresh_token', data.refresh_token);

        window.location.href = Session.home(Session.audience());
      } catch (err) {
        const isNetwork = err instanceof TypeError;
        showError(isNetwork ? 'Error de conexión con el servidor.' : err.message);
        setLoading(false);
      }
    });

    [emailInput, passwordInput, agencyInput].forEach((el) => el.addEventListener('input', hideError));
  </script>
</body>
</html>
